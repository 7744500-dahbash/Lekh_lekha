<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>תאג' תורת אבות - פרשת לך לך</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #172554;
      --accent: #b45309;
      --stopper-red: #c53030;       /* אדום: עצירה (אתנחתא, זקף) */
      --pause-orange: #ea580c;      /* כתום: מטעים / פשטא / יתיב */
      --kisra-taj: #fef08a;         /* צהוב: כיסרא בתאג' */
      --kisra-stam: #cbd5e1;        /* אפור: כיסרא בסת"ם */
      --border: #cbd5e1;
      --bg: #f8fafc;
      --text: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Assistant', system-ui, sans-serif;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1050px;
      margin: 0 auto;
      background: #ffffff;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* 1. כותרת דקה */
    header {
      background: var(--primary);
      color: #fff;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      min-height: 38px;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #bfdbfe;
    }

    /* 2. נגן שמע עם בורר מברך ישיר */
    .audio-strip {
      background: #f1f5f9;
      border-bottom: 1.5px solid var(--border);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }

    .audio-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .btn-play {
      background: var(--primary);
      color: #fff;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* בורר מברך ישיר להשמעה */
    .select-mevarech {
      flex: 1;
      max-width: 220px;
      height: 32px;
      border: 1.5px solid var(--primary);
      border-radius: 6px;
      background: #fff;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--primary);
      padding: 0 6px;
      cursor: pointer;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-ctrl {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 7px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      height: 32px;
    }

    .speed-select {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      padding: 2px 4px;
      font-size: 0.75rem;
      font-weight: 700;
      height: 32px;
    }

    /* 3. סרגל כפתורי עליות */
    .nav-bar {
      display: flex;
      gap: 4px;
      padding: 5px 8px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .nav-bar::-webkit-scrollbar { display: none; }

    .nav-btn {
      flex: 0 0 auto;
      padding: 4px 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
    }

    .nav-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* 4. סרגל מצבים ומקרא */
    .toolbar-strip {
      padding: 4px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .mode-group {
      display: flex;
      background: #e2e8f0;
      padding: 2px;
      border-radius: 6px;
      gap: 2px;
    }

    .mode-btn {
      padding: 3px 8px;
      border: none;
      background: transparent;
      border-radius: 4px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      color: #475569;
    }

    .mode-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    .legend-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }
    .dot-box { width: 8px; height: 8px; border-radius: 2px; display: inline-block; vertical-align: middle; }
    .dot-red { background: var(--stopper-red); }
    .dot-orange { background: var(--pause-orange); }
    .dot-yellow { background: var(--kisra-taj); border: 1px solid #d97706; }

    /* 5. אזור הפסוקים המוגדל */
    .viewport {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
      -webkit-overflow-scrolling: touch;
    }

    .dual-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      height: 100%;
    }

    .col-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 8px;
      background: #fff;
      overflow-y: auto;
    }

    .col-header {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--primary);
      border-bottom: 1.5px solid var(--primary);
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .bible-verse {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #e2e8f0;
      line-height: 2.2;
      font-size: 1.32rem;
    }

    .verse-ref {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent);
      margin-left: 4px;
      user-select: none;
    }

    .taj-typography {
      font-family: 'Frank Ruhl Libre', serif;
      font-feature-settings: "kern" 1, "mark" 1, "mkmk" 1;
      text-rendering: optimizeLegibility;
    }

    .stam-typography {
      font-family: 'Frank Ruhl Libre', serif;
      letter-spacing: 0.5px;
    }

    /* חוקי צבע מדויקים */
    .apply-cues .stopper-word { color: var(--stopper-red) !important; font-weight: 800; }
    .apply-cues .orange-pause-word { color: var(--pause-orange) !important; font-weight: 700; }
    .apply-cues .kisra-taj-word { background-color: var(--kisra-taj); padding: 0 3px; border-radius: 3px; font-weight: 700; }
    .apply-cues .stam-stopper { font-weight: 900; color: #000; text-decoration: underline 1.5px #94a3b8; }
    .apply-cues .stam-orange { color: #9a3412; font-weight: 700; }
    .apply-cues .stam-kisra { background-color: var(--kisra-stam); padding: 0 3px; border-radius: 3px; }

    /* שינון בחצאים */
    .chunk-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .chunk-part {
      padding: 8px 10px;
      border-radius: 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-size: 1.3rem;
      line-height: 2.1;
      margin-bottom: 6px;
    }
    .chunk-title {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .hidden-stam { filter: blur(6px); cursor: pointer; transition: filter 0.2s; user-select: none; }
    .hidden-stam.unveiled { filter: none; }
    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .dual-columns { grid-template-columns: 1fr; }
      .bible-verse { font-size: 1.25rem; line-height: 2.1; }
    }
  </style>
</head>
<body class="apply-cues">

<div class="app-shell">
  <!-- 1. כותרת עליונה -->
  <header>
    <div class="brand-title">
      <span>תאג' תורת אבות</span>
      <span style="font-size:0.75rem; font-weight:400; opacity:0.8;">| פרשת לך לך</span>
    </div>
    <div class="status-badge" id="dataStatus">טוען נתונים...</div>
  </header>

  <!-- 2. נגן שמע שורתי עם בחירת מברך ישירה -->
  <div class="audio-strip">
    <div class="audio-left">
      <button class="btn-play" id="playBtn" onclick="toggleAudio()">▶</button>
      <select class="select-mevarech" id="mevarechSelect" onchange="selectMevarech(this.value, true)">
        <option value="1">מברך ראשון (יב, א-יג)</option>
        <option value="2">מברך שני (יב, יד - יג, ד)</option>
        <option value="3">מברך שלישי (יג, ה-יח)</option>
        <option value="4">מברך רביעי (יד, א-כד)</option>
        <option value="5" selected>מברך חמישי (טו, א - טז, טז)</option>
        <option value="6">מברך ששי (יז, א-כג)</option>
        <option value="7">מברך שביעי (יז, כד-כז)</option>
      </select>
    </div>
    <div class="audio-controls">
      <button class="btn-ctrl" onclick="seekAudio(-5)">-5s</button>
      <button class="btn-ctrl" onclick="seekAudio(5)">+5s</button>
      <select class="speed-select" onchange="setAudioSpeed(this.value)">
        <option value="0.85">0.85x</option>
        <option value="1" selected>1.0x</option>
        <option value="1.15">1.15x</option>
      </select>
    </div>
    <audio id="audioEl" preload="auto"></audio>
  </div>

  <!-- 3. סרגל עליות מהיר -->
  <nav class="nav-bar" id="aliyahNav"></nav>

  <!-- 4. סרגל מצבים -->
  <div class="toolbar-strip">
    <div class="mode-group">
      <button class="mode-btn active" onclick="setAppMode('dual')">דו-עמודי</button>
      <button class="mode-btn" onclick="setAppMode('chunks')">שינון בחצאים</button>
      <button class="mode-btn" onclick="setAppMode('scrollOnly')">סת"ם בלבד</button>
    </div>
    <div class="legend-mini">
      <span><span class="dot-box dot-red"></span> עוצר</span>
      <span><span class="dot-box dot-orange"></span> מטעים</span>
      <span><span class="dot-box dot-yellow"></span> כיסרא</span>
    </div>
  </div>

  <!-- 5. אזור הפסוקים -->
  <main class="viewport">
    <div id="dualView" class="dual-columns">
      <div class="col-card" id="tajColCard">
        <div class="col-header">תאג' מנוקד (דקדוק תימן)</div>
        <div class="taj-typography" id="tajVersesContainer"></div>
      </div>

      <div class="col-card">
        <div class="col-header">תיקון סופרים (כתב סת"ם)</div>
        <div class="stam-typography" id="stamVersesContainer"></div>
      </div>
    </div>

    <div id="chunksView" class="hidden"></div>
  </main>
</div>

<script>
  // קובצי השמע שהועלו ישירות לתיקייה הראשית (1.mp3 עד 7.mp3)
  const ALIYOT_DEFS = [
    { id: 1, name: 'ראשון', audioFile: '1.mp3', range: { chStart: 12, vStart: 1, chEnd: 12, vEnd: 13 }, ref: "יב:א-יג" },
    { id: 2, name: 'שני', audioFile: '2.mp3', range: { chStart: 12, vStart: 14, chEnd: 13, vEnd: 4 }, ref: "יב:יד-יג:ד" },
    { id: 3, name: 'שלישי', audioFile: '3.mp3', range: { chStart: 13, vStart: 5, chEnd: 13, vEnd: 18 }, ref: "יג:ה-יח" },
    { id: 4, name: 'רביעי', audioFile: '4.mp3', range: { chStart: 14, vStart: 1, chEnd: 14, vEnd: 24 }, ref: "יד:א-כד" },
    { id: 5, name: 'חמישי', audioFile: '5.mp3', range: { chStart: 15, vStart: 1, chEnd: 16, vEnd: 16 }, ref: "טו:א-טז:טז" },
    { id: 6, name: 'ששי', audioFile: '6.mp3', range: { chStart: 17, vStart: 1, chEnd: 17, vEnd: 23 }, ref: "יז:א-כג" },
    { id: 7, name: 'שביעי', audioFile: '7.mp3', range: { chStart: 17, vStart: 24, chEnd: 17, vEnd: 27 }, ref: "יז:כד-כז" }
  ];

  const PURE_STOPPERS_REGEX = /[\u0591\u0592\u0594\u0595]/; // אתנחתא, סגולתא, זקפים (אדום)
  const TARCHA_REGEX = /\u0596/;                             // כיסרא / טרחא
  const LIGHT_PAUSE_REGEX = /[\u0599\u059A\u0597\u059B\u059C\u059D\u059E\u059F\u05A0\u05A1\u0598]/; // פשטא, יתיב (כתום)
  const NIKKUD_AND_ACCENTS = /[\u0591-\u05BD\u05BF-\u05C2\u05C4\u05C5\u05C7]/g;

  let allVerses = [];
  let currentAliyahId = 5;
  let currentMode = 'dual';

  const audio = document.getElementById("audioEl");
  const playBtn = document.getElementById("playBtn");
  const mevarechSelect = document.getElementById("mevarechSelect");

  function toStamWord(w) {
    return w.replace(NIKKUD_AND_ACCENTS, '').replace(/\u05C3/g, '').replace(/\u05C0/g, '');
  }

  function analyzeVerseYemenite(rawVerseText, chapter, verseNum) {
    const tokens = rawVerseText.trim().split(/(\s+)/);
    const parsedWords = [];

    tokens.forEach(tok => {
      if (/^\s+$/.test(tok) || tok === '') {
        parsedWords.push({ isSpace: true, text: tok });
      } else {
        parsedWords.push({
          isSpace: false,
          tajOriginal: tok,
          stamOriginal: toStamWord(tok),
          hasStopper: PURE_STOPPERS_REGEX.test(tok),
          hasLightPause: LIGHT_PAUSE_REGEX.test(tok),
          hasTarcha: TARCHA_REGEX.test(tok),
          hasEtnahta: /\u0591/.test(tok),
          isKisra: false
        });
      }
    });

    for (let i = parsedWords.length - 1; i >= 0; i--) {
      const w = parsedWords[i];
      if (!w.isSpace && w.hasTarcha) {
        w.isKisra = true;
        break;
      }
    }

    let tajHtml = '', stamHtml = '';
    let part1Taj = '', part1Stam = '';
    let part2Taj = '', part2Stam = '';
    let passedEtnahta = false;

    parsedWords.forEach(w => {
      if (w.isSpace) {
        tajHtml += w.text; stamHtml += w.text;
        if (!passedEtnahta) { part1Taj += w.text; part1Stam += w.text; }
        else { part2Taj += w.text; part2Stam += w.text; }
        return;
      }

      let tajWordHtml = w.tajOriginal;
      let stamWordHtml = w.stamOriginal;

      if (w.isKisra) {
        tajWordHtml = `<span class="kisra-taj-word">${w.tajOriginal}</span>`;
        stamWordHtml = `<span class="stam-kisra">${w.stamOriginal}</span>`;
      } else if (w.hasStopper) {
        tajWordHtml = `<span class="stopper-word">${w.tajOriginal}</span>`;
        stamWordHtml = `<span class="stam-stopper">${w.stamOriginal}</span>`;
      } else if (w.hasLightPause) {
        tajWordHtml = `<span class="orange-pause-word">${w.tajOriginal}</span>`;
        stamWordHtml = `<span class="stam-orange">${w.stamOriginal}</span>`;
      }

      tajHtml += tajWordHtml; stamHtml += stamWordHtml;

      if (!passedEtnahta) {
        part1Taj += tajWordHtml; part1Stam += stamWordHtml;
        if (w.hasEtnahta) passedEtnahta = true;
      } else {
        part2Taj += tajWordHtml; part2Stam += stamWordHtml;
      }
    });

    return {
      chapter, verseNum,
      label: `${toHebrewNum(chapter)}:${toHebrewNum(verseNum)}`,
      tajHtml, stamHtml,
      part1Taj: part1Taj || tajHtml, part1Stam: part1Stam || stamHtml,
      part2Taj: part2Taj || '', part2Stam: part2Stam || ''
    };
  }

  function toHebrewNum(n) {
    const letters = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט", "י", "יא", "יב", "יג", "יד", "טו", "טז", "יז", "יח", "יט", "כ", "כא", "כב", "כג", "כד", "כה", "כו", "כז", "כח", "כט", "ל"];
    return letters[n] || n;
  }

  async function loadParashatLekhLekha() {
    try {
      const chapters = [12, 13, 14, 15, 16, 17];
      const data = await Promise.all(chapters.map(ch => fetch(`https://www.sefaria.org/api/texts/Genesis.${ch}?context=0`).then(r => r.json())));
      const parsedList = [];
      data.forEach((chData, idx) => {
        chData.he.forEach((rawText, vIdx) => {
          parsedList.push(analyzeVerseYemenite(rawText.replace(/<[^>]+>/g, ''), chapters[idx], vIdx + 1));
        });
      });
      allVerses = parsedList;
      document.getElementById("dataStatus").textContent = "126 פסוקים";
      renderApp();
      selectMevarech(currentAliyahId, false); // טעינה ראשונית בלי ניגון כפוי עד לחיצה
    } catch (e) {
      document.getElementById("dataStatus").textContent = "שגיאת רשת";
    }
  }

  function renderApp() {
    renderNav();
    renderDualColumns();
    renderChunks();
  }

  function renderNav() {
    const nav = document.getElementById("aliyahNav");
    nav.innerHTML = "";
    ALIYOT_DEFS.forEach(a => {
      const btn = document.createElement("button");
      btn.className = `nav-btn ${a.id === currentAliyahId ? 'active' : ''}`;
      btn.textContent = `${a.name} (${a.ref})`;
      btn.onclick = () => selectMevarech(a.id, true);
      nav.appendChild(btn);
    });
  }

  /* בחירת מברך - מסנכרנת טקסט, מעדכנת בורר, ומתחילה לנגן מיד! */
  function selectMevarech(id, autoPlay = true) {
    currentAliyahId = parseInt(id);
    mevarechSelect.value = currentAliyahId;

    renderApp();

    const aliyah = ALIYOT_DEFS.find(a => a.id === currentAliyahId);
    audio.src = aliyah.audioFile;

    if (autoPlay) {
      audio.play().then(() => {
        playBtn.textContent = "⏸";
      }).catch(err => {
        console.warn("Autoplay prevented:", err);
        playBtn.textContent = "▶";
      });
    } else {
      playBtn.textContent = "▶";
    }
  }

  function renderDualColumns() {
    const tajBox = document.getElementById("tajVersesContainer");
    const stamBox = document.getElementById("stamVersesContainer");
    tajBox.innerHTML = ""; stamBox.innerHTML = "";
    getFilteredVerses().forEach(v => {
      tajBox.innerHTML += `<div class="bible-verse"><span class="verse-ref">(${v.label})</span> ${v.tajHtml}</div>`;
      stamBox.innerHTML += `<div class="bible-verse"><span class="verse-ref">(${v.label})</span> ${v.stamHtml}</div>`;
    });
  }

  function renderChunks() {
    const container = document.getElementById("chunksView");
    container.innerHTML = "";
    getFilteredVerses().forEach(v => {
      container.innerHTML += `
        <div class="chunk-card">
          <div class="chunk-title">פסוק (${v.label}) | שלב א': עד האתנחתא</div>
          <div class="chunk-part taj-typography">${v.part1Taj}</div>
          <div class="chunk-part stam-typography hidden-stam" onclick="this.classList.toggle('unveiled')">${v.part1Stam}</div>
          ${v.part2Taj ? `
            <div class="chunk-title" style="margin-top:6px;">שלב ב': סוף הפסוק (דרך הכיסרא)</div>
            <div class="chunk-part taj-typography">${v.part2Taj}</div>
            <div class="chunk-part stam-typography hidden-stam" onclick="this.classList.toggle('unveiled')">${v.part2Stam}</div>
          ` : ''}
        </div>`;
    });
  }

  function getFilteredVerses() {
    const def = ALIYOT_DEFS.find(a => a.id === currentAliyahId) || ALIYOT_DEFS[4];
    return allVerses.filter(v => {
      if (v.chapter < def.range.chStart || v.chapter > def.range.chEnd) return false;
      if (v.chapter === def.range.chStart && v.verseNum < def.range.vStart) return false;
      if (v.chapter === def.range.chEnd && v.verseNum > def.range.vEnd) return false;
      return true;
    });
  }

  function toggleAudio() {
    if (audio.paused) {
      audio.play().then(() => {
        playBtn.textContent = "⏸";
      }).catch(err => alert("קובץ השמע לא נמצא בנתיב הנוכחי. ודא שאתה גולש לכתובת עם /Lekh_lekha/"));
    } else {
      audio.pause();
      playBtn.textContent = "▶";
    }
  }

  function seekAudio(sec) { audio.currentTime += sec; }
  function setAudioSpeed(r) { audio.playbackRate = parseFloat(r); }

  /* מעבר אוטומטי למברך הבא בסיום ההשמעה */
  audio.addEventListener("ended", () => {
    if (currentAliyahId < 7) {
      selectMevarech(currentAliyahId + 1, true);
    } else {
      playBtn.textContent = "▶";
    }
  });

  function setAppMode(mode) {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    event.target.classList.add("active");
    const dual = document.getElementById("dualView");
    const chunks = document.getElementById("chunksView");
    const taj = document.getElementById("tajColCard");

    if (mode === 'dual') { dual.classList.remove("hidden"); chunks.classList.add("hidden"); taj.classList.remove("hidden"); }
    else if (mode === 'chunks') { dual.classList.add("hidden"); chunks.classList.remove("hidden"); }
    else if (mode === 'scrollOnly') { dual.classList.remove("hidden"); chunks.classList.add("hidden"); taj.classList.add("hidden"); }
  }

  window.addEventListener("DOMContentLoaded", loadParashatLekhLekha);
</script>

</body>
</html>
